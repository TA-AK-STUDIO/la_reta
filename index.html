<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <title>La Reta ⚽</title>
  <link rel="icon" type="image/png" href="/assets/logo.png">

  <!-- Open Graph / Social preview -->
  <meta property="og:type"        content="website" />
  <meta property="og:url"         content="https://la-reta.vercel.app/" />
  <meta property="og:title"       content="La Reta ⚽ — El juego de fútbol callejero" />
  <meta property="og:description" content="Mantén el balón en el aire el mayor tiempo posible. ¿Puedes dominar la reta?" />
  <meta property="og:image"       content="https://la-reta.vercel.app/assets/og_image.png" />
  <meta property="og:image:width"  content="1200" />
  <meta property="og:image:height" content="630" />

  <!-- Twitter / X card -->
  <meta name="twitter:card"        content="summary_large_image" />
  <meta name="twitter:url"         content="https://la-reta.vercel.app/" />
  <meta name="twitter:title"       content="La Reta ⚽ — El juego de fútbol callejero" />
  <meta name="twitter:description" content="Mantén el balón en el aire el mayor tiempo posible. ¿Puedes dominar la reta?" />
  <meta name="twitter:image"       content="https://la-reta.vercel.app/assets/og_image.png" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      overflow: hidden;
      background: #1a0a2e;
      touch-action: none;
      font-family: Arial, sans-serif;
    }
    #loading-screen {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: #1a0a2e;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      color: white;
    }
    #loading-screen.show { display: flex; }
    #loading-text { font-size: 22px; color: #ffcc00; }
    canvas { display: block; image-rendering: auto; }
  </style>
</head>
<body>
  <div id="loading-screen">
    <div id="loading-text">Cargando La Reta...</div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
